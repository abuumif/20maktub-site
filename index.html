<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Senga 20 ta maktub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--butter:#fbe7a1;--lav:#d8ccf0;--blue:#cde5f4;--peach:#fcd8bf;--mint:#cbeedc;--cream:#fff8ea;--rose:#f1bfce;--ink:#5a4a5f;--gold:#e9bd55;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--hand:"Caveat","Segoe Script","Bradley Hand",cursive}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--serif);color:var(--ink);background:var(--cream);overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;background:
radial-gradient(60% 50% at 12% 10%,var(--butter),transparent 70%),
radial-gradient(60% 55% at 92% 18%,var(--lav),transparent 70%),
radial-gradient(60% 55% at 8% 90%,var(--blue),transparent 70%),
radial-gradient(60% 55% at 95% 92%,var(--peach),transparent 70%),
radial-gradient(45% 40% at 50% 50%,var(--mint),transparent 75%),var(--cream)}
.light{position:fixed;width:60vmax;height:60vmax;border-radius:50%;z-index:0;filter:blur(60px);opacity:.5;pointer-events:none;
background:radial-gradient(circle,rgba(255,255,255,.95),transparent 65%);animation:drift 26s ease-in-out infinite alternate}
.light.b{background:radial-gradient(circle,rgba(255,226,170,.8),transparent 65%);animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translate(-25vw,-20vh)}to{transform:translate(30vw,25vh)}}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .6 0 0 0 0 .5 0 0 0 0 .4 0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none}
.scene{position:fixed;inset:0;z-index:3;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;
opacity:0;visibility:hidden;transform:scale(1.04);filter:blur(12px);transition:opacity 1.1s ease,transform 1.1s ease,filter 1.1s ease,visibility 0s 1.1s;
padding:max(24px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
.scene.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity 1.1s ease .15s,transform 1.1s ease .15s,filter 1.1s ease .15s}
/* welcome */
#welcome{justify-content:center;text-align:center}
.sprig{position:absolute;width:170px;opacity:.55;pointer-events:none}
.sprig.a{left:-18px;bottom:6%;transform:rotate(18deg)}
.sprig.b{right:-22px;top:5%;transform:rotate(200deg)}
.seal{width:62px;height:62px;margin:0 auto 26px;filter:drop-shadow(0 6px 8px rgba(190,110,130,.35))}
h1{font-weight:600;font-size:clamp(2.1rem,9vw,3.6rem);line-height:1.1;letter-spacing:.01em;font-style:italic;max-width:12em}
.sub{margin:18px auto 38px;max-width:21em;font-size:clamp(1.15rem,4.4vw,1.4rem);line-height:1.45;opacity:.85}
.btn{font-family:var(--serif);font-size:1.25rem;font-weight:600;color:var(--ink);cursor:pointer;border:1px solid rgba(255,255,255,.9);
padding:15px 34px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,236,190,.6));
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px -8px rgba(160,120,170,.45),0 0 0 6px rgba(255,255,255,.25),inset 0 1px 0 #fff;
transition:transform .4s,box-shadow .4s;animation:glow 4s ease-in-out infinite}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
@keyframes glow{50%{box-shadow:0 12px 36px -6px rgba(233,189,85,.7),0 0 0 11px rgba(255,255,255,.18),inset 0 1px 0 #fff}}
/* jar scene */
#jarScene{padding-top:max(30px,env(safe-area-inset-top))}
.head{text-align:center;margin-bottom:22px}
.head h2{font-style:italic;font-weight:600;font-size:clamp(1.7rem,7vw,2.4rem)}
.hint{font-family:var(--hand);font-size:1.3rem;margin-top:6px;opacity:.85;min-height:1.6em;transition:opacity .5s}
.jarwrap{position:relative;width:min(92vw,430px);margin:6px auto 0;display:flex;flex-direction:column;align-items:center}
.lid{position:relative;z-index:5;width:78%;height:40px;border-radius:10px 10px 6px 6px;cursor:pointer;transform-origin:0 100%;
background:repeating-linear-gradient(176deg,rgba(120,70,30,.14) 0 2px,transparent 2px 7px),linear-gradient(180deg,#e6c18d,#c99660 55%,#a97543);
box-shadow:inset 0 3px 3px rgba(255,255,255,.5),inset 0 -4px 6px rgba(90,50,20,.35),0 6px 14px rgba(90,60,40,.3);
transition:transform 1.2s cubic-bezier(.5,0,.2,1)}
.lid::after{content:"";position:absolute;left:8%;right:60%;top:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.4);filter:blur(2px)}
.jarwrap.open .lid{transform:translate(46%,-70px) rotate(24deg)}
.neck{position:relative;z-index:4;width:82%;height:26px;margin-top:-3px;border-radius:8px 8px 4px 4px;
background:linear-gradient(90deg,rgba(255,255,255,.8),rgba(230,240,255,.35) 25%,rgba(255,255,255,.2) 70%,rgba(255,255,255,.75));
border:1.5px solid rgba(255,255,255,.9);box-shadow:inset 0 -6px 10px rgba(255,255,255,.5),0 2px 8px rgba(150,150,200,.25)}
.jar{position:relative;width:100%;margin-top:-2px;border-radius:34px 34px 74px 74px;overflow:hidden;
background:linear-gradient(100deg,rgba(255,255,255,.55),rgba(255,255,255,.1) 22%,rgba(255,255,255,.06) 72%,rgba(255,255,255,.5)),linear-gradient(180deg,rgba(220,235,255,.22),rgba(255,235,210,.28));
border:2px solid rgba(255,255,255,.85);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);
box-shadow:inset 0 0 50px rgba(255,255,255,.7),inset -14px 0 34px rgba(170,190,240,.35),inset 12px 0 30px rgba(255,220,200,.3),0 40px 60px -30px rgba(120,100,160,.5)}
.letters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;padding:30px 14px 46px;position:relative}
.shine{position:absolute;pointer-events:none;border-radius:20px;z-index:3;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
.s1{left:6%;top:4%;width:5%;height:62%;filter:blur(1px)}
.s2{left:14%;top:5%;width:2%;height:30%;opacity:.8}
.s3{right:6%;top:12%;width:3%;height:70%;opacity:.55;filter:blur(1.5px)}
.s4{left:0;right:0;bottom:0;height:16%;border-radius:0 0 74px 74px;background:linear-gradient(0deg,rgba(255,255,255,.6),transparent)}
.shadow{width:84%;height:26px;margin-top:-10px;border-radius:50%;background:radial-gradient(closest-side,rgba(110,90,140,.38),transparent);filter:blur(4px)}
.l{position:relative;height:58px;border:0;cursor:pointer;text-align:left;font-family:var(--hand);font-weight:600;font-size:clamp(.98rem,3.9vw,1.15rem);line-height:1.02;color:#5b4331;
padding:0 8px 0 30px;display:flex;align-items:center;border-radius:5px 9px 9px 5px;transform:rotate(var(--r));
background:radial-gradient(120% 90% at 30% 20%,#fffbee,#f5e3bd 70%,#e9cf9f);
box-shadow:inset 7px 0 8px -5px rgba(150,105,50,.4),inset -7px 0 8px -5px rgba(150,105,50,.35),0 3px 6px rgba(120,90,50,.25);
animation:bob 6s ease-in-out infinite var(--d);transition:filter .4s}
.l::before{content:"";position:absolute;left:9px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#f9c4d0,#d98ba0);box-shadow:0 2px 3px rgba(150,70,90,.4)}
.l::after{content:"✦";position:absolute;right:4px;top:-2px;font-size:11px;color:var(--gold);opacity:0;animation:tw 4.5s ease-in-out infinite var(--d)}
.l span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.jarwrap:not(.open) .l{pointer-events:none}
.jarwrap.open .l:hover{filter:brightness(1.06) drop-shadow(0 0 8px rgba(255,220,130,.9))}
@keyframes bob{50%{transform:rotate(calc(var(--r) * -.6)) translateY(-3px)}}
@keyframes tw{0%,60%,100%{opacity:0;transform:scale(.5)}75%{opacity:1;transform:scale(1.2)}}
.fly{position:fixed;z-index:20;margin:0;animation:none;transition:transform 1s cubic-bezier(.4,0,.2,1),opacity .6s;pointer-events:none;
filter:drop-shadow(0 0 14px rgba(255,220,130,.9))}
/* paper */
#paperWrap{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;
background:rgba(255,248,234,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .7s,visibility 0s .7s}
#paperWrap.on{opacity:1;visibility:visible;transition:opacity .7s}
.paper{position:relative;width:min(100%,520px);max-height:86dvh;overflow:auto;padding:34px 26px 26px;border-radius:6px 10px 8px 12px;text-align:center;
background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.04 .9' numOctaves='3'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .4 0 0 0 0 .2 0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
radial-gradient(130% 100% at 50% 0%,#fffdf4,#f8ebc9 75%,#ecd5a3);
box-shadow:inset 0 0 60px rgba(180,130,60,.35),0 30px 70px -20px rgba(90,60,90,.55);
transform:translateY(60px) scale(.6) rotateX(50deg);transform-origin:50% 100%;transition:transform 1s cubic-bezier(.2,.9,.2,1)}
#paperWrap.on .paper{transform:none}
.paper .seal{width:54px;height:54px;margin:0 auto 6px;display:block}
.paper .num{display:block;font-family:var(--hand);font-size:1.5rem;letter-spacing:.2em;color:#b98d4e;margin-bottom:4px}
.paper .sig:before{content:"— — —";display:block;font-family:var(--serif);font-size:1rem;letter-spacing:.3em;opacity:.6;margin-bottom:6px}
.paper h3{font-style:italic;font-weight:600;font-size:clamp(1.55rem,6.4vw,2rem);line-height:1.15;margin-bottom:16px}
.paper .rule{height:1px;width:46%;margin:0 auto 20px;background:linear-gradient(90deg,transparent,#b98d4e,transparent)}
.paper p{font-size:clamp(1.12rem,4.3vw,1.28rem);line-height:1.6;text-align:left;font-weight:500;white-space:pre-line}
.paper .sig{font-family:var(--hand);font-size:1.5rem;margin-top:26px;display:block}
.back{margin-top:22px;font-size:1.1rem;padding:12px 26px;animation:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<ellipse cx="62" cy="100" rx="7" ry="10" transform="rotate(50 62 100)"/><ellipse cx="90" cy="74" rx="7" ry="10" transform="rotate(50 90 74)"/><ellipse cx="118" cy="48" rx="6" ry="9" transform="rotate(50 118 48)"/></g>

<path d="M32 42c-8-6-10-10-10-14a6 6 0 0 1 10-3 6 6 0 0 1 10 3c0 4-2 8-10 14z" fill="#fff" fill-opacity=".4"/></symbol></defs></svg>

<!-- 1. Xush kelibsiz -->
<section class="scene on" id="welcome">
  <svg class="sprig a"><use href="#sprig"/></svg><svg class="sprig b"><use href="#sprig"/></svg>
  <svg class="seal"><use href="#wax"/></svg>
  <h1>Bugun kayfiyating qanday?</h1>
  <p class="sub">Kayfiyatingga qarab, senga atalgan maktublardan birini tanla.</p>
  <button class="btn" id="enter">Sehrli dunyoga kirish</button>
</section>

<!-- 2. Sehrli banka -->
<section class="scene" id="jarScene">
  <div class="head"><h2>Senga yigirmata maktub</h2><p class="hint" id="hint">Qopqoqni ochish uchun bankaga bos</p></div>
  <div class="jarwrap" id="jar">
    <div class="lid" id="lid" title="Qopqoq"></div><div class="neck"></div>
    <div class="jar"><div class="letters" id="letters"></div><i class="shine s1"></i><i class="shine s2"></i><i class="shine s3"></i><i class="shine s4"></i></div>
    <div class="shadow"></div>
  </div>
</section>

<!-- Maktub -->
<div id="paperWrap"><article class="paper" id="paperScroll" role="dialog" aria-modal="true">
  <svg class="seal"><use href="#wax"/></svg>
  <span class="num" id="pNum"></span><h3 id="pTitle"></h3><div class="rule"></div><p id="pBody"></p><span class="sig" id="pSig"></span>
  <button class="btn back" id="back">← Bankaga qaytish</button>
</article></div>

<script>
/* ====== MAKTUBLARNI SHU YERDA TAHRIRLANG ======
   t = bankadagi yorliq, b = maktub matni, imzo = pastdagi imzo */
const IMZO = "Senga atalgan maktub";
const LETTERS = [
["Dunyodan charchab ketganingda",`Azizim,

Ba'zan dunyo odamdan juda ko‘p narsa talab qiladi. Har kuni nimagadir ulgurish, kimlargadir nimanidir isbotlash, kuchli ko‘rinish, yiqilmaslik... Go‘yo insonning charchashga ham haqqi yo‘qdek.

Ammo bilasanmi, sen har doim kuchli bo‘lishing shart emas. Ba'zi kunlari hech narsaga erishmasang ham mayli. Hech kimga javob bermasang, hech qayerga shoshilmasang ham mayli. Hatto bugun o‘zingni tushunolmasang ham.

Men seni faqat kulib turganingda yoki hamma ishni uddalayotganingda yaxshi ko‘rmayman. Charchagan, sukut saqlagan, ba'zan o‘zingdan norozi bo‘lgan holingda ham qadrlayman.

Dunyo seni shoshiraversin. Sen esa biroz to‘xta. Nafas ol. Hali oldinda yashashimiz kerak bo‘lgan juda ko‘p go‘zal kunlar bor.`],
["O‘zingni yolg‘iz his qilganingda",`Bilasanmi, insonlar orasida ham yolg‘iz qolish mumkin. Ba'zan atrofing to‘la odam bo‘ladi, lekin birortasi ichingda nimalar kechayotganini bilmaydi.

Men sening barcha sukutlaringni tushunaman, deb da'vo qilmayman. Axir insonning qalbida hatto o‘ziga ham tushuntirish qiyin bo‘lgan xonalar bor.

Lekin bir narsani bilishingni istayman: sening mavjudliging kimningdir hayotida oddiy hodisa emas. Men uchun sen shunchaki kunlarimdan birida uchragan inson emassan. Sen bilan tanishganimdan keyin ayrim narsalarga boshqacha qaray boshladim.

Hozir yoningda bo‘lmasam ham, bu seni o‘ylamayapman degani emas.

Ba'zan eng yaqin insonlar bir-biridan uzoqda turib ham, qalban bir-biriga yaqin bo‘lishi mumkin.`],
["O‘zingni go‘zal his qilmagan kuningda",`Bugun oynaga qarab o‘zingdan ko‘ngling to‘lmagan bo‘lsa kerak.

Balki sochlaring yoqmagandir, balki yuzingdagi biror jihatni o‘zgartirishni istagandirsan. Balki shunchaki o‘zingni boshqalar bilan solishtirib qo‘ygandirsan.

Men senga go‘zallik haqida odatiy gaplarni aytmoqchi emasman. Chunki sening go‘zalligingni birgina yuzing bilan o‘lchab bo‘lmaydi.

Men sening gapirayotganda ayrim so‘zlarni qanday talaffuz qilishingni, nimadandir xursand bo‘lib ketishingni, ba'zan arzimas narsalarga jiddiy qarashingni, o‘zing sezmaydigan kichik odatlaringni yaxshi ko‘raman.

Oyna bugun senga yoqmagan narsalarni ko‘rsatishi mumkin. Lekin u sening men ko‘radigan barcha go‘zalligingni ko‘rsata olmaydi.

Iltimos, o‘zingga biroz mehribonroq bo‘l.`],
["Mendan xafa bo‘lganingda",`Men hamisha to‘g‘ri gapiradigan, hech qachon xato qilmaydigan inson emasman.

Ba'zan tushunmasligim, ba'zan noto‘g‘ri munosabat bildirishim, ba'zan esa aytishim kerak bo‘lgan so‘zlarni vaqtida topolmasligim mumkin.

Ammo bir narsani istayman: oramizdagi biror tushunmovchilik sening qalbingda yolg‘izlik hissini uyg‘otmasin.

Sevgi ikki insonning hech qachon xato qilmasligi emas. Menimcha, sevgi — xatolar ortidan ham bir-birini tushunishga urinish, g‘ururni biroz chetga surib, «Keling, gaplashib olaylik», deya bilishdir.

Agar seni ranjitgan bo‘lsam, buni bilishni istayman. O‘zimni oqlash uchun emas, seni tushunish uchun.

Men sen bilan bahslashib g‘olib chiqishdan ko‘ra, ikkimiz bir-birimizni yo‘qotmaydigan suhbatda qolishni afzal bilaman.`],
["Tunda uxlay olmayotganingda",`Tun insonni g‘alati o‘ylarga boshlaydi.

Kunduzi ahamiyatsiz tuyulgan voqealar yarim tunda kattalashadi. Aytilmagan gaplar, amalga oshmagan rejalar, kelajak haqidagi savollar birin-ketin xayolga keladi.

Agar hozir shunday tunni boshdan kechirayotgan bo‘lsang, bir narsani esla: har bir savolga bugunoq javob topishing shart emas.

Ba'zi narsalar vaqt bilan oydinlashadi. Ba'zi tashvishlar esa tong otishi bilan o‘z kuchini yo‘qotadi.

Men hozir yoningda bo‘lganimda, balki hech narsa demasdim. Shunchaki yoningda yotib, sokinligingga sherik bo‘lardim.

Ko‘zlaringni yum, azizim. Ertaga yana bir kun boshlanadi. Bugun esa o‘zingga dam ber.

Yaxshi tun.`],
["Meni sog‘ingan paytingda",`Masofa haqida ko‘p gapirish mumkin. Xaritalar, kilometrlar, soatlar va turli vaqt mintaqalari haqida.

Lekin menimcha, masofaning eng og‘ir tomoni uning uzunligida emas. U oddiy bir lahzani murakkablashtirib qo‘yishida.

Masalan, hozir seni ko‘rgim keldi. Shunchaki yoningda o‘tirib, kuning qanday o‘tganini so‘ragim keldi. Biror kulgili voqeani aytib berib, yuzingdagi tabassumni ko‘rgim keldi.

Ammo hozircha buning o‘rniga senga maktub yozyapman.

Bir kun kelib bu xatlarni o‘qib, masofa haqida kulib eslashimizga ishonaman. O‘shanda bugungi sog‘inchlarimiz ham umumiy tariximizning bir qismiga aylanadi.

Ungacha meni sog‘inishing mumkin. Men ham seni sog‘inaman.`],
["Nega aynan sen?",`Bu savolga javob berish qiyin.

Chunki men seni yaxshi ko‘rishim uchun bir nechta sabablarni sanab, keyin ularni boshqalar bilan taqqoslashni istamayman.

Senda menga yoqadigan jihatlar ko‘p, albatta. Lekin ularning hech biri alohida holda seni sen qilmaydi.

Menimcha, insonni sevish — uning barcha xususiyatlarini ro‘yxatga olish emas. Bu insonning mavjudligiga ko‘nikib qolish ham emas. Aksincha, uning borligini har safar yangidan qadrlashdir.

Men seni boshqalardan yaxshiroq bo‘lganing uchun emas, boshqalarga o‘xshashing yoki o‘xshamasliging uchun ham emas, aynan sen bo‘lganing uchun yaxshi ko‘raman.

Agar yana qaytadan tanlash imkonim bo‘lganida, seni yana tanishni istardim.`],
["Kelajakdagi bizga",`Bir kuni bu maktublarni birga o‘qishimizni tasavvur qilaman.

Balki o‘shanda yonma-yon o‘tirarmiz. Balki hozir biz uchun juda uzoq tuyulayotgan orzularimizning ayrimlari allaqachon amalga oshgan bo‘lar.

Men kelajak haqida ko‘p narsani bilmayman. Qayerda yashashimizni, qanday uyimiz bo‘lishini, qaysi shaharlarga borishimizni aniq aytolmayman.

Lekin bir narsani xohlayman: kelajakda ham bir-birimiz bilan gaplashishga qiziqishimiz yo‘qolmasin.

Yillar o‘tsa ham, sen menga kuningdagi eng arzimas voqealarni aytib berishni istagin. Men esa ularni tinglashdan zerikmay.

Chunki men uchun baxt faqat katta voqealardan iborat emas. Ba'zan bir inson bilan oddiy kunlarni ham mazmunli o‘tkaza olishning o‘zi katta baxt.`],
["Yig‘lagging kelganda",`Yig‘lama, deb aytmayman.

Chunki ba'zan ko‘z yoshlar insonning ojizligi emas, ichida uzoq vaqt yig‘ilib qolgan hislarning tabiiy ifodasidir.

O‘zingni tutishing, hammasini ichingga yutishing yoki hech kimga bildirmasliging shart emas.

Agar yig‘lagging kelsa, yig‘la. Agar gaplashging kelsa, gapir. Agar sukut saqlashni istasang, bunga ham haqqing bor.

Men seni doimo xursand qilishga va'da berolmayman. Hayotda bunga hech kimning kuchi yetmaydi.

Lekin qayg‘uingni arzimas deb hisoblamaslikka, seni tinglashga va hislaringga befarq bo‘lmaslikka harakat qilaman.

Sening ko‘z yoshlaring ham, tabassuming kabi, e'tiborga loyiq.`],
["Birinchi uchrashuvimiz haqida",`Ba'zan hayotdagi eng muhim voqealar sodir bo‘layotgan paytda ularning qanchalik muhimligini bilmaymiz.

Men ham seni tanigan paytimda kelajakda shu qadar ko‘p o‘ylashimni, oddiy suhbatlaringni

O‘sha paytda sen shunchaki hayotimda paydo bo‘lgan bir inson eding.

Keyin esa vaqt o‘tdi. Suhbatlarimiz ko‘paydi. Sening ayrim gaplaring yodimda qoldi. Men bilmagan yangi bir dunyo ochildi.

Endi o‘sha ilk kunni eslasam, hayotning tasodiflari haqida o‘ylayman.

Qiziq, o‘sha kuni ikkimiz ham oldimizda qanday hikoya boshlanayotganini bilmagan ekanmiz.

Men esa bu hikoyaning davom etishini istayman.`],
["Sening kichik odatlaring haqida",`Insonni yaxshi ko‘rib qolishning g‘alati tomoni bor.

Avvaliga uning katta fazilatlariga e'tibor berasan. Keyinchalik esa boshqalar sezmaydigan arzimas narsalar ham senga qadrli bo‘lib qoladi.

Uning gap orasida kulib yuborishi, biror narsadan hayajonlanishi, ba'zan o‘jarlik qilishi, o‘ziga xos so‘zlari...

Men ham senda shunday mayda jihatlarni ko‘raman.

Balki o‘zing ular haqida hech qachon o‘ylamagandirsan. Balki ba'zilarini hatto kamchilik deb hisoblarsan.

Lekin bilasanmi, mehrning bir ko‘rinishi ham shudir: insonning boshqalar e'tibor bermaydigan jihatlarini ham qadrlash.

Men seni faqat hammaga ko‘rinadigan tomoning bilan tanimayman. Sening kichik dunyoingni ham bilishni istayman.`],
["Bugun kulging kelganda",`Bugun sendan faqat bir narsani so‘rayman: kul.

Sababsiz bo‘lsa ham kul. Biror kulgili narsani esla. Bolaligingdagi ahmoqona voqealarni yodga ol. O‘zingni juda jiddiy tutishga urinma.

Men ba'zan hayotning eng chiroyli lahzalari inson rejalashtirmagan paytda sodir bo‘lishini o‘ylayman.

Masalan, birga kulib yuborganimizda, hech qanday muhim mavzuni muhokama qilmay, arzimas narsalar haqida gaplashganimizda...

Menimcha, insonning baxti faqat ulkan yutuqlarda emas. Ba'zan uning hech qanday sababsiz kulishiga imkon beradigan insonning borligida hamdir.

Bugun kayfiyating yaxshi bo‘lsin.

Va iltimos, o‘sha tabassumingni hech kimdan, hatto mendan ham qarz olma. U o‘zingniki.`],
["Kelajakdan qo‘rqqaningda",`Kelajak — hali sodir bo‘lmagan voqealar uchun bugundan xavotirlanishimizga sabab bo‘ladigan g‘alati tushuncha.

Ba'zan hammasini oldindan bilishni istaymiz. Nima bo‘ladi? Qayerda bo‘lamiz? Orzularimiz amalga oshadimi? Biz istagan insonlar hayotimizda qoladimi?

Men ham bularning javobini bilmayman.

Ammo bir narsani tushundim: hayotni faqat uning oxirida nima bo‘lishiga qarab baholash adolatsizlik.

Biz hali ko‘p narsani o‘rganamiz. Xato qilamiz, o‘zgaramiz, ayrim orzularimizdan voz kechamiz, yangilarini topamiz.

Sen esa bu jarayonda o‘zingni yo‘qotib qo‘yma.

Men sening orzularingni kichraytirishni emas, ularga yetishingni ko‘rishni istayman.

Kelajakdan qo‘rqma. U hali biz yozib ulgurmagan sahifalardan iborat.`],
["Bizning sevgimiz haqida o‘ylaganingda",`Men sevgini ikki insonning bir-biriga butunlay tegishli bo‘lib qolishi deb tushunmayman.

Sen mening hayotimda bo‘lishing mumkin, lekin sening o‘z hayoting, fikrlaring, orzularing va shaxsiy dunyoing ham bor.

Men bularning barchasini hurmat qilishni istayman.

Seni o‘zgartirishga, o‘zimga o‘xshatishga yoki dunyoingni faqat men bilan chegaralashga ehtiyoj sezmayman.

Aksincha, o‘zligingni saqlagan holda yonimda bo‘lishingni istayman.

Chunki menimcha, haqiqiy yaqinlik — ikki insonning bir-biriga qo‘shilib ketishi emas, balki ikki alohida dunyoning bir-biriga begona bo‘lib qolmasligidir.

Men sen bilan shunday sevgini qurishni xohlayman.`],
["Senga aytolmagan gaplarim",`Ba'zi gaplarni yuzma-yuz aytish qiyin.

Ularni aytish uchun to‘g‘ri vaqtni kutasan. Keyin vaqt keladi, lekin so‘zlar topilmaydi. Ba'zan esa oddiygina bir «seni yaxshi ko‘raman» ortida juda ko‘p aytilmagan fikrlar yashiringan bo‘ladi.

Masalan, sen bilan gaplashganimdan keyin kayfiyatim qanday o‘zgarishini bilishingni istardim.

Ba'zan kun davomida biror narsani ko‘rib qolaman-u, darhol senga aytish haqida o‘ylayman. Biror kitobdagi jumla, ko‘chadagi manzara yoki kulgili voqea...

Shunda tushunaman: insonning hayotida kimdir alohida o‘rin egallay boshlasa, u hatto o‘zi ko‘rgan dunyoni ham o‘sha inson bilan bo‘lishishni istar ekan.

Men ham dunyomni sen bilan bo‘lishishni istayman.`],
["Oramizda masofa bo‘lmaganda",`Agar hozir yonimda bo‘lganingda, balki katta rejalar tuzmasdik.

Shunchaki birga sayr qilardik. Biror qahvaxonaga kirardik. Ko‘chalarda maqsadsiz aylanib yurardik.

Balki men senga nimanidir tushuntirishga urinardim, sen esa gapimni bo‘lib, boshqa mavzuga o‘tib ketarding.

Keyin birga kulardik.

Qizig‘i, men aynan shunday oddiy lahzalarni ko‘proq xohlayman.

Chunki inson sog‘inganida doimo katta uchrashuvlarni tasavvur qilavermaydi. Ba'zan uning butun istagi sevgan insonining yonida oddiygina o‘tirishdan iborat bo‘ladi.

Hozircha oramizda masofa bor.

Lekin bir kun kelib, «Bugun qayerga boramiz?» degan savolni telefon orqali emas, yoningda turib berishni xohlayman.`],
["Sening tabassuming haqida",`Menimcha, ayrim insonlar hayotimizga kirib kelgach, dunyoning o‘zi o‘zgarmaydi. Faqat biz unga boshqacha qaray boshlaymiz.

Oldin e'tibor bermagan narsalarimizga qaraymiz. Biror qo‘shiq boshqacha eshitiladi. Ayrim joylar xotiraga aylanadi. Oddiy bir kun ham kim bilandir bog‘lanib qoladi.

Sening tabassuming men uchun shunday narsalardan biri.

Uni ko‘rganimda hayot birdan mukammal bo‘lib qolmaydi. Barcha muammolar yo‘qolmaydi.

Lekin bir lahzaga hamma narsa biroz yengillashadi.

Men sendan doimo kulib yurishingni so‘ramayman. Faqat hayotingda kulishga arziydigan sabablar ko‘p bo‘lishini istayman.

Va imkon bo‘lsa, o‘sha sabablarning ayrimlarida mening ham hissam bo‘lsin.`],
["Hech qachon o‘zingni yo‘qotmagin",`Azizim,

Bir kun kelib hayot seni o‘zgartirishi mumkin.

Balki bugungi qarashlaring o‘zgarar, orzularing boshqacha tus olar, avval muhim deb bilgan narsalaringning ahamiyati qolmas.

Bu tabiiy. Inson yashagan sari o‘zgaradi.

Ammo bir narsani unutmagin: birovning sevgisiga munosib bo‘lish uchun o‘zingdan voz kechishing shart emas.

O‘zingning fikring bo‘lsin. O‘zing istagan narsalarni o‘rgan. Sayohat qil. Kitoblar o‘qi. Xato qil. O‘zing uchun yangi dunyolar kashf et.

Men sening hayotingdagi yagona mazmun bo‘lishni emas, mazmunli hayotingning bir qismi bo‘lishni istayman.

Sen o‘zing bo‘lib qol. Men aynan shu inson bilan birga ulg‘ayishni xohlayman.`],
["Bir kun kelib...",`Bir kun kelib, ehtimol, bugungi kunlarni eslaymiz.

Uzoq suhbatlarimizni, kutgan qo‘ng‘iroqlarimizni, bir-birimizni ko‘rishga bo‘lgan istaklarimizni.

Balki o‘shanda masofa degan so‘z biz uchun shunchaki xaritadagi ikki nuqta orasidagi o‘lchov bo‘lib qoladi.

Men bir manzarani tasavvur qilaman.

Tashqarida yomg‘ir yog‘moqda. Biz esa bir joyda o‘tiribmiz. Stol ustida ikkita finjon, yonimizda ochiq kitob. Sen nimanidir hikoya qilyapsan, men esa seni tinglayapman.

Hech qanday shoshilish yo‘q. Hech qanday xayrlashuv yo‘q.

Balki baxt shudir.

Biz uzoq vaqt davomida orzu qilgan oddiy bir kun.

O‘sha kun kelishini kutaman.`],
["Agar bu oxirgi maktub bo‘lsa...",`Azizim,

Mana, yigirmanchi maktubga ham yetib kelding.

Bilmayman, avvalgi o‘n to‘qqizta maktubning qaysi biri senga ko‘proq yoqdi. Balki ayrimlarini qayta o‘qirsan, ayrimlariga esa shunchaki tabassum qilib qo‘yarsan.

Lekin bu oxirgi maktubda senga boshqa narsani aytmoqchiman.

Men seni yaxshi ko‘raman.

Bu gapni ko‘p marta aytgan bo‘lishim mumkin. Lekin uning ma'nosi men uchun har safar bir xil emas. Vaqt o‘tishi bilan insonning mehr haqidagi tushunchalari ham o‘zgaradi.

Avvaliga sevgi kimnidir juda sog‘inish, doimo u bilan gaplashishni istashdek tuyuladi. Keyinchalik esa uning baxtli bo‘lishini, o‘z orzulariga yetishini, hayotdan zavq olishini ham chin dildan istay boshlaysan.

Men senga shunday yaxshiliklarni tilayman.

Bu yigirma maktubning har birida men senga nimanidir qoldirishga harakat qildim: bir oz tasalli, bir oz tabassum, bir oz xotira va ko‘p mehr.

Agar bir kun kelib ularni qayta o‘qisang, shuni esla:

Dunyoning qaysidir burchagida bir inson bor. U sening borligingni qadrlaydi. Sening fikrlaring, orzularing va hatto sukuting ham uning uchun ahamiyatli.

Va bu maktublar tugagan bo‘lsa-da, senga aytadigan gaplarim tugamagan.

Mehr bilan,
seni tanlagan inson.`]
].map(([t,b])=>({t,b}));

const $=id=>document.getElementById(id);
const jar=$("jar"), box=$("letters"), wrap=$("paperWrap"), hint=$("hint");
let current=null, busy=false;

LETTERS.forEach((L,i)=>{
  const b=document.createElement("button");
  b.className="l"; b.innerHTML="<span>"+L.t+"</span>";
  b.style.setProperty("--r",((i*37%11)-5)*.9+"deg");
  b.style.setProperty("--d",(-(i*1.3%6)).toFixed(1)+"s");
  b.setAttribute("aria-label",L.t);
  b.addEventListener("click",e=>{e.stopPropagation();openLetter(b,L)});
  box.appendChild(b);
});

$("enter").onclick=()=>{ $("welcome").classList.remove("on"); $("jarScene").classList.add("on"); };

function toggleJar(){
  const open=jar.classList.toggle("open");
  hint.style.opacity=0;
  setTimeout(()=>{hint.textContent=open?"Bittasini tanla":"Qopqoqni ochish uchun bankaga bos";hint.style.opacity=1},400);
}
jar.addEventListener("click",e=>{ if(!jar.classList.contains("open")||e.target.id==="lid") toggleJar(); });

function openLetter(el,L){
  if(busy) return; busy=true; current=el;
  const r=el.getBoundingClientRect(), f=el.cloneNode(true);
  f.classList.add("fly");
  Object.assign(f.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
  document.body.appendChild(f); el.style.visibility="hidden";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const dx=innerWidth/2-(r.left+r.width/2), dy=innerHeight/2-(r.top+r.height/2)-40;
    f.style.transform="translate("+dx+"px,"+dy+"px) scale(2.1) rotate(0deg)";
  }));
  setTimeout(()=>{
    $("pNum").textContent=String(LETTERS.indexOf(L)+1).padStart(2,"0"); $("pTitle").textContent=L.t; $("paperScroll").scrollTop=0; $("pBody").textContent=L.b; $("pSig").textContent=IMZO;
    wrap.classList.add("on"); f.style.opacity=0;
    setTimeout(()=>f.remove(),600);
  },800);
}
function closeLetter(){
  if(!current) return;
  wrap.classList.remove("on");
  setTimeout(()=>{current.style.visibility="";current=null;busy=false},650);
}
$("back").onclick=closeLetter;
wrap.addEventListener("click",e=>{if(e.target===wrap)closeLetter()});
addEventListener("keydown",e=>{if(e.key==="Escape")closeLetter()});

/* ===== Zarrachalar: yulduzlar, yorug‘ nuqtalar, gul barglari ===== */
const cv=$("fx"), cx=cv.getContext("2d"); let W,H,P=[];
const COL=["#e9bd55","#c7b1ea","#f0a9bf","#8fc4e4","#9bd9b8"];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener("resize",size); size();
const N=innerWidth<600?46:80;
for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1.2,t:i%5<2?0:i%5<4?1:2,
  v:Math.random()*.3+.08,s:(Math.random()-.5)*.25,ph:Math.random()*6.3,c:COL[i%5],a:Math.random()*6.3});
function frame(t){
  cx.clearRect(0,0,W,H);
  for(const p of P){
    p.y-=p.v*(p.t===2?-1.2:1); p.x+=p.s+Math.sin(t/2200+p.ph)*.18; p.a+=.004;
    if(p.y<-20)p.y=H+20; if(p.y>H+20)p.y=-20; if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20;
    const tw=.5+.5*Math.sin(t/700+p.ph);
    cx.save(); cx.translate(p.x,p.y); cx.fillStyle=p.c;
    if(p.t===0){ cx.globalAlpha=.35+.6*tw; cx.beginPath(); const R=p.r*2.6,q=R*.22;
      cx.moveTo(0,-R);cx.quadraticCurveTo(q,-q,R,0);cx.quadraticCurveTo(q,q,0,R);cx.quadraticCurveTo(-q,q,-R,0);cx.quadraticCurveTo(-q,-q,0,-R);cx.fill(); }
    else if(p.t===1){ const g=cx.createRadialGradient(0,0,0,0,0,p.r*6); g.addColorStop(0,"rgba(255,255,255,.95)");g.addColorStop(.35,p.c+"99");g.addColorStop(1,p.c+"00");
      cx.globalAlpha=.4+.4*tw; cx.fillStyle=g; cx.beginPath(); cx.arc(0,0,p.r*6,0,6.3); cx.fill(); }
    else { cx.globalAlpha=.5; cx.rotate(p.a); cx.beginPath(); cx.ellipse(0,0,p.r*2.6,p.r*1.3,0,0,6.3); cx.fill(); }
    cx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
